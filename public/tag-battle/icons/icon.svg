<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a12"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b9d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Spray can body -->
  <rect x="180" y="140" width="152" height="280" rx="20" fill="#2d2d4a" stroke="#3a3a5a" stroke-width="4"/>

  <!-- Spray can top -->
  <rect x="200" y="100" width="112" height="50" rx="10" fill="#4a4a6a"/>
  <circle cx="256" cy="85" r="20" fill="#e94560"/>

  <!-- Spray effect -->
  <ellipse cx="340" cy="200" rx="60" ry="40" fill="#e94560" opacity="0.3"/>
  <ellipse cx="360" cy="180" rx="40" ry="25" fill="#ff6b6b" opacity="0.5"/>
  <ellipse cx="375" cy="165" rx="25" ry="15" fill="#feca57" opacity="0.7"/>

  <!-- TAG text -->
  <text x="256" y="320" font-family="Arial Black, sans-serif" font-size="72" font-weight="bold" fill="url(#accent)" text-anchor="middle">TAG</text>

  <!-- Graffiti drips -->
  <path d="M195 380 L195 420 Q195 430 205 430 Q215 430 215 420 L215 380" fill="#e94560"/>
  <path d="M240 380 L240 400 Q240 410 250 410 Q260 410 260 400 L260 380" fill="#ff6b6b"/>
  <path d="M295 380 L295 435 Q295 445 305 445 Q315 445 315 435 L315 380" fill="#e94560"/>
</svg>
